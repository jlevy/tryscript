name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint:check
      - run: pnpm build
      - run: pnpm publint
      - run: pnpm --filter tryscript test:coverage

      # Post coverage report as PR comment (always runs so devs see coverage even on failure)
      - name: Coverage Report
        uses: davelosert/vitest-coverage-report-action@v2
        if: always() && github.event_name == 'pull_request'
        with:
          json-summary-path: packages/tryscript/coverage/coverage-summary.json
          json-final-path: packages/tryscript/coverage/coverage-final.json
          file-coverage-mode: changes

      # Generate and commit coverage badges (main branch only)
      - name: Coverage Badges
        uses: jpb06/coverage-badges-action@v1.4.6
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          coverage-summary-path: packages/tryscript/coverage/coverage-summary.json
          output-folder: ./badges
          branches: main
          no-commit: true

      # Update badge links to point to this run, then commit all changes
      - name: Update Badge Links
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          ./scripts/update-badge-links.sh
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update coverage badges and links"
            git push
          fi
