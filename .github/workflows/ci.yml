name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint:check
      - run: pnpm build
      - run: pnpm publint

      # Run all tests with combined V8 coverage collection
      - name: Run tests with coverage
        working-directory: packages/tryscript
        run: |
          # Create temp directory for V8 coverage data
          export NODE_V8_COVERAGE=$(mktemp -d)
          echo "Collecting coverage to $NODE_V8_COVERAGE"

          # Run unit tests (vitest)
          pnpm vitest run

          # Run golden tests
          node dist/bin.mjs run 'tests/**/*.tryscript.md'

          # Generate combined coverage report
          ./node_modules/.bin/c8 report \
            --temp-directory "$NODE_V8_COVERAGE" \
            --reports-dir coverage \
            --src src \
            --all \
            --include 'dist/**' \
            --reporter text \
            --reporter json \
            --reporter json-summary \
            --reporter lcov \
            --reporter html

          echo "Coverage report generated:"
          cat coverage/coverage-summary.json | head -20

      # Post coverage report as PR comment (always runs so devs see coverage even on failure)
      - name: Coverage Report
        uses: davelosert/vitest-coverage-report-action@v2
        if: always() && github.event_name == 'pull_request'
        with:
          json-summary-path: packages/tryscript/coverage/coverage-summary.json
          json-final-path: packages/tryscript/coverage/coverage-final.json
          file-coverage-mode: changes

      # Generate and commit coverage badges (main branch only)
      - name: Coverage Badges
        uses: jpb06/coverage-badges-action@v1.4.6
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          coverage-summary-path: packages/tryscript/coverage/coverage-summary.json
          output-folder: ./badges
          branches: main
